<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Internship Branches</title>

            <div class="slide1"> <button onclick="navigateToDomains('Agriculture')"><div class="Agriculture">Agriculture</div></button></div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
