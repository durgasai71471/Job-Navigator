button:hover{
    box-shadow: 0 0 4px 4px grey; 
    cursor: pointer;
    transform: scale(1.05);
    color:black;
    background-color: white;
    /* background-color: brown; */
    transition: all 0.5s ease;
}
a{
    text-decoration: none;
    /* color:white; */
    color: black;
}
button::before{     
    content: "";
        position: absolute;
        width:100%;
        height: 100%;
        left:-100%;
        background-color: white;
        transition: all 0.5s linear;
        z-index: -5;
        border-radius: 50px;
}
button:hover::before{
        left:0%;
    }
